name: Update news
# Weekday mornings and middays (06:45 and 12:45 UTC), whenever the script or this workflow changes, and on demand.
# Needs the MARKETAUX_KEY repository secret; without it the job does nothing.
on:
  schedule:
    - cron: '45 6 * * 1-5'
    - cron: '45 12 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['news_fetch.py', '.github/workflows/news.yml']
permissions:
  contents: write
concurrency:
  group: market-data
  cancel-in-progress: false
jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download headlines from Marketaux
        env:
          MARKETAUX_KEY: ${{ secrets.MARKETAUX_KEY }}
        run: python3 news_fetch.py news.json
      - name: Save the file if it changed
        run: |
          [ -f news.json ] || { echo 'No news file yet'; exit 0; }
          git config user.name 'market-data bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add news.json
          git diff --cached --quiet && { echo 'No change'; exit 0; }
          git commit -m "News $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase origin main && git push
